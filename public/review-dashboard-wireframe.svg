<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
  <title id="title">商家运营后台详细原型</title>
  <desc id="description">经营概览、平台配置和内容回复工作台的三页详细结构原型。</desc>
  <style>
    .bg { fill: #f7f5f1; }
    .ink { fill: #332b26; }
    .title { font: 600 39px Georgia, 'Times New Roman', 'Microsoft YaHei', serif; fill: #332820; }
    .section { font: 600 21px Georgia, 'Times New Roman', 'Microsoft YaHei', serif; fill: #3e3028; }
    .label { font: 700 13px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #55483e; }
    .body { font: 500 12px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #74685e; }
    .small { font: 500 10px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #93867a; }
    .tiny { font: 600 9px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #8c7f73; }
    .button { font: 700 11px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #fff; }
    .pill { font: 700 10px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #6c5949; }
    .line { stroke: #e2d9ce; stroke-width: 1; }
  </style>
  <rect class="bg" width="1600" height="1060"/>
  <rect x="46" y="38" width="1508" height="984" rx="28" fill="#fffdfa" stroke="#e1d8ce"/>
  <text x="94" y="108" class="title">商家运营后台 · 第 3 部分细化</text>
  <text x="94" y="138" class="body">同一套后台信息架构；商家/行业只替换数据、服务、品牌和平台链接。</text>
  <rect x="1170" y="82" width="312" height="48" rx="24" fill="#f4ece3"/>
  <text x="1220" y="112" class="label">设计交付：3 个桌面端页面</text>
  <line x1="94" y1="168" x2="1506" y2="168" class="line"/>

  <!-- top legend -->
  <circle cx="117" cy="215" r="16" fill="#8d6750"/><text x="113" y="220" class="button">1</text>
  <text x="145" y="221" class="section">经营概览</text>
  <text x="145" y="245" class="body">看数据、分享顾客链接、进入待办</text>
  <circle cx="630" cy="215" r="16" fill="#8d6750"/><text x="626" y="220" class="button">2</text>
  <text x="658" y="221" class="section">平台配置</text>
  <text x="658" y="245" class="body">启用开关、真实外链、发布提示</text>
  <circle cx="1135" cy="215" r="16" fill="#8d6750"/><text x="1131" y="220" class="button">3</text>
  <text x="1163" y="221" class="section">内容与回复</text>
  <text x="1163" y="245" class="body">真实输入、编辑草稿、人工确认</text>

  <!-- overview desktop -->
  <g transform="translate(92,278)">
    <rect width="440" height="608" rx="16" fill="#fffdfa" stroke="#d9cfc3" stroke-width="2"/>
    <rect width="92" height="608" rx="16" fill="#312b27"/>
    <rect x="76" width="16" height="608" fill="#312b27"/>
    <text x="22" y="42" class="button">RF</text>
    <text x="17" y="93" class="tiny" fill="#d8cec5">经营概览</text>
    <text x="17" y="129" class="tiny" fill="#d8cec5">品牌门店</text>
    <text x="17" y="165" class="tiny" fill="#d8cec5">服务商品</text>
    <text x="17" y="201" class="tiny" fill="#d8cec5">平台链接</text>
    <text x="17" y="237" class="tiny" fill="#d8cec5">内容工作台</text>
    <text x="17" y="273" class="tiny" fill="#d8cec5">评价回复</text>
    <text x="119" y="39" class="label">商家名称　/　门店名称　⌄</text>
    <line x1="114" y1="56" x2="406" y2="56" class="line"/>
    <text x="114" y="94" class="section">今日经营概览</text>
    <text x="114" y="117" class="small">先看顾客内容是否完成，避免把“打开平台”当作已发布。</text>
    <g transform="translate(114,138)">
      <rect width="86" height="68" rx="12" fill="#f6eee5"/><text x="13" y="24" class="tiny">生成草稿</text><text x="13" y="52" class="section">128</text>
      <rect x="97" width="86" height="68" rx="12" fill="#f1f5ee"/><text x="110" y="24" class="tiny">已复制</text><text x="110" y="52" class="section">76</text>
      <rect x="194" width="86" height="68" rx="12" fill="#f0f3fb"/><text x="207" y="24" class="tiny">已打开平台</text><text x="207" y="52" class="section">52</text>
    </g>
    <text x="114" y="238" class="label">顾客内容漏斗</text>
    <rect x="114" y="251" width="285" height="11" rx="5" fill="#ece5dc"/>
    <rect x="114" y="251" width="236" height="11" rx="5" fill="#b99273"/>
    <rect x="114" y="251" width="168" height="11" rx="5" fill="#8d6750"/>
    <text x="114" y="282" class="small">生成 128　→　复制 76　→　打开 52</text>
    <text x="114" y="322" class="label">快捷操作</text>
    <rect x="114" y="337" width="136" height="35" rx="17" fill="#8d6750"/><text x="145" y="359" class="button">复制顾客链接</text>
    <rect x="263" y="337" width="136" height="35" rx="17" fill="#fff" stroke="#d9c7b6"/><text x="294" y="359" class="pill">预览顾客页</text>
    <text x="114" y="414" class="label">近期评价待处理</text>
    <rect x="114" y="429" width="285" height="46" rx="10" fill="#fff" stroke="#e6ddd4"/>
    <text x="128" y="450" class="body">评价内容摘要…</text><rect x="339" y="440" width="45" height="22" rx="11" fill="#f5ede4"/><text x="350" y="455" class="tiny">回复</text>
    <rect x="114" y="484" width="285" height="46" rx="10" fill="#fff" stroke="#e6ddd4"/>
    <text x="128" y="505" class="body">另一条评价摘要…</text><rect x="339" y="495" width="45" height="22" rx="11" fill="#f5ede4"/><text x="350" y="510" class="tiny">回复</text>
    <text x="114" y="574" class="tiny">固定左侧导航；顶部固定商家 / 门店切换。</text>
  </g>

  <!-- platform config desktop -->
  <g transform="translate(578,278)">
    <rect width="440" height="608" rx="16" fill="#fffdfa" stroke="#d9cfc3" stroke-width="2"/>
    <rect width="92" height="608" rx="16" fill="#312b27"/>
    <rect x="76" width="16" height="608" fill="#312b27"/>
    <text x="22" y="42" class="button">RF</text>
    <text x="17" y="93" class="tiny" fill="#d8cec5">经营概览</text>
    <text x="17" y="129" class="tiny" fill="#d8cec5">品牌门店</text>
    <text x="17" y="165" class="tiny" fill="#d8cec5">服务商品</text>
    <rect x="10" y="179" width="72" height="29" rx="8" fill="#55483e"/><text x="17" y="198" class="tiny" fill="#fff">平台链接</text>
    <text x="17" y="237" class="tiny" fill="#d8cec5">内容工作台</text>
    <text x="17" y="273" class="tiny" fill="#d8cec5">评价回复</text>
    <text x="114" y="40" class="label">平台链接</text>
    <rect x="319" y="23" width="82" height="32" rx="16" fill="#8d6750"/><text x="343" y="44" class="button">保存</text>
    <line x1="114" y1="70" x2="406" y2="70" class="line"/>
    <text x="114" y="108" class="section">发布平台配置</text>
    <text x="114" y="131" class="small">只有启用且填入真实链接的平台，才会在顾客端可点击。</text>
    <g transform="translate(114,151)">
      <rect width="285" height="86" rx="12" fill="#fff" stroke="#e5dbd0"/>
      <circle cx="20" cy="22" r="10" fill="#477fd9"/><text x="17" y="26" class="button">G</text><text x="38" y="26" class="label">Google Reviews</text>
      <rect x="221" y="13" width="48" height="20" rx="10" fill="#e8f2e5"/><text x="233" y="27" class="tiny">启用</text>
      <rect x="16" y="44" width="253" height="27" rx="8" fill="#fffdfa" stroke="#e1d7cc"/><text x="27" y="62" class="small">https://maps.google.com/…</text>
      <rect y="98" width="285" height="86" rx="12" fill="#fff" stroke="#e5dbd0"/>
      <circle cx="20" cy="120" r="10" fill="#e95d69"/><text x="15" y="124" class="button">红</text><text x="38" y="124" class="label">小红书</text>
      <rect x="221" y="111" width="48" height="20" rx="10" fill="#f2eee8"/><text x="231" y="125" class="tiny">待配</text>
      <rect x="16" y="142" width="253" height="27" rx="8" fill="#fffdfa" stroke="#e1d7cc"/><text x="27" y="160" class="small">发布页 / 主页链接（可留空）</text>
      <rect y="196" width="135" height="72" rx="12" fill="#fff" stroke="#e5dbd0"/><text x="17" y="221" class="label">Yelp</text><text x="17" y="246" class="small">未启用，不展示</text>
      <rect x="150" y="196" width="135" height="72" rx="12" fill="#fff" stroke="#e5dbd0"/><text x="167" y="221" class="label">Instagram</text><text x="167" y="246" class="small">未启用，不展示</text>
    </g>
    <rect x="114" y="457" width="285" height="72" rx="12" fill="#fbf5ed" stroke="#eadccc"/>
    <text x="129" y="482" class="label">发布提示</text>
    <text x="129" y="505" class="small">“请核对并修改，系统不会自动发布。”</text>
    <text x="114" y="574" class="tiny">每张平台卡固定：图标、名称、启用开关、链接输入、发布提示。</text>
  </g>

  <!-- studio desktop -->
  <g transform="translate(1064,278)">
    <rect width="440" height="608" rx="16" fill="#fffdfa" stroke="#d9cfc3" stroke-width="2"/>
    <rect width="92" height="608" rx="16" fill="#312b27"/>
    <rect x="76" width="16" height="608" fill="#312b27"/>
    <text x="22" y="42" class="button">RF</text>
    <text x="17" y="93" class="tiny" fill="#d8cec5">经营概览</text>
    <text x="17" y="129" class="tiny" fill="#d8cec5">品牌门店</text>
    <text x="17" y="165" class="tiny" fill="#d8cec5">服务商品</text>
    <text x="17" y="201" class="tiny" fill="#d8cec5">平台链接</text>
    <rect x="10" y="215" width="72" height="29" rx="8" fill="#55483e"/><text x="16" y="234" class="tiny" fill="#fff">内容工作台</text>
    <text x="17" y="273" class="tiny" fill="#d8cec5">评价回复</text>
    <text x="114" y="40" class="label">内容工作台</text>
    <line x1="114" y1="57" x2="406" y2="57" class="line"/>
    <text x="114" y="94" class="section">真实体验 → 平台文案</text>
    <text x="114" y="118" class="small">顾客原话不会自动沉淀成个人档案；只统计匿名使用次数。</text>
    <text x="114" y="150" class="label">真实体验</text>
    <rect x="114" y="162" width="285" height="70" rx="12" fill="#fff" stroke="#ded4c9"/>
    <text x="128" y="188" class="small">输入顾客真实体验，或运营人员整理的原话…</text>
    <text x="114" y="260" class="label">服务与体验标签</text>
    <rect x="114" y="272" width="72" height="27" rx="14" fill="#f2e5d6"/><text x="132" y="290" class="tiny">服务 A</text>
    <rect x="194" y="272" width="62" height="27" rx="14" fill="#fff" stroke="#e1d7cc"/><text x="209" y="290" class="tiny">安静</text>
    <rect x="264" y="272" width="62" height="27" rx="14" fill="#fff" stroke="#e1d7cc"/><text x="276" y="290" class="tiny">不催促</text>
    <rect x="114" y="320" width="63" height="26" rx="13" fill="#e8f0fe"/><text x="128" y="337" class="tiny">Google</text>
    <rect x="184" y="320" width="58" height="26" rx="13" fill="#fff0f2"/><text x="195" y="337" class="tiny">小红书</text>
    <rect x="249" y="320" width="47" height="26" rx="13" fill="#fff" stroke="#e1d7cc"/><text x="261" y="337" class="tiny">Yelp</text>
    <rect x="303" y="320" width="64" height="26" rx="13" fill="#fff" stroke="#e1d7cc"/><text x="315" y="337" class="tiny">IG</text>
    <text x="114" y="379" class="label">可编辑草稿</text>
    <rect x="114" y="391" width="285" height="72" rx="12" fill="#fff" stroke="#ded4c9"/>
    <text x="128" y="417" class="small">生成的草稿显示在这里；运营人员可直接修改。</text>
    <text x="128" y="439" class="small">系统提示：发布前以真实体验为准。</text>
    <rect x="114" y="478" width="135" height="35" rx="17" fill="#3e332b"/><text x="151" y="500" class="button">复制草稿</text>
    <rect x="262" y="478" width="137" height="35" rx="17" fill="#8d6750"/><text x="291" y="500" class="button">生成新版本</text>
    <text x="114" y="554" class="label">评价回复</text>
    <text x="114" y="576" class="small">选中手工 / 演示评价 → 生成引用原文的回复草稿。</text>
  </g>

  <line x1="94" y1="920" x2="1506" y2="920" class="line"/>
  <text x="108" y="954" class="label">给设计的关键约束：</text>
  <text x="272" y="954" class="body">不做行业专属布局；各页保持固定骨架。组件需要覆盖默认、悬停、禁用、空状态和移动端收缩规则。</text>
  <text x="108" y="982" class="label">需要设计输出：</text>
  <text x="244" y="982" class="body">3 页高保真 + 组件库（导航、卡片、输入框、标签、开关、按钮、平台状态、数据漏斗）。</text>
</svg>
