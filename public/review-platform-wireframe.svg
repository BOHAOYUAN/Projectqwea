<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">多商家评价运营平台统一原型</title>
  <desc id="description">顾客页、AI 文案页和商家后台的通用布局及关键操作原型。</desc>
  <style>
    .bg { fill: #f7f5f1; }
    .ink { fill: #2f2924; }
    .muted { fill: #796f66; }
    .caption { font: 500 15px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #796f66; }
    .label { font: 700 14px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #594d43; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #8b8178; }
    .tiny { font: 600 10px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #82766c; }
    .title { font: 600 42px Georgia, 'Times New Roman', serif; fill: #30251f; letter-spacing: 1px; }
    .section { font: 600 23px Georgia, 'Times New Roman', 'Microsoft YaHei', serif; fill: #3a2d25; }
    .num { font: 700 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #fff; }
    .ui { font: 600 13px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #40372f; }
    .uiSmall { font: 500 11px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; fill: #6f635a; }
    .serif { font: 500 22px Georgia, 'Times New Roman', 'Microsoft YaHei', serif; fill: #382a22; }
    .line { stroke: #ddd4ca; stroke-width: 1; }
    .dash { stroke: #c9b9a7; stroke-width: 1.5; stroke-dasharray: 5 6; fill: none; }
  </style>
  <rect class="bg" width="1600" height="1050"/>
  <rect x="48" y="42" width="1504" height="966" rx="30" fill="#fffdfa" stroke="#e1d8ce"/>

  <text x="98" y="116" class="title">ReviewFlow</text>
  <text x="98" y="147" class="caption">多商家评价运营平台 · 通用产品原型（商家只换品牌皮肤与内容配置）</text>
  <rect x="1137" y="85" width="340" height="48" rx="24" fill="#f3ece3"/>
  <text x="1170" y="115" class="label">可复用布局 · 不限美容行业</text>
  <line x1="98" y1="180" x2="1502" y2="180" class="line"/>

  <!-- Flow labels -->
  <g>
    <circle cx="142" cy="236" r="18" fill="#8d6750"/><text x="138" y="241" class="num">1</text>
    <text x="174" y="243" class="section">顾客评价入口</text>
    <text x="174" y="268" class="caption">品牌信息 · 服务选择 · 平台入口</text>
  </g>
  <g>
    <circle cx="617" cy="236" r="18" fill="#8d6750"/><text x="613" y="241" class="num">2</text>
    <text x="649" y="243" class="section">平台专属文案页</text>
    <text x="649" y="268" class="caption">真实输入 · 多选标签 · 编辑复制</text>
  </g>
  <g>
    <circle cx="1052" cy="236" r="18" fill="#8d6750"/><text x="1048" y="241" class="num">3</text>
    <text x="1084" y="243" class="section">商家运营后台</text>
    <text x="1084" y="268" class="caption">数据 · 配置 · 内容 · 回复</text>
  </g>

  <!-- Arrows -->
  <path d="M 475 470 C 520 470, 535 470, 568 470" class="dash"/>
  <path d="M 560 462 L 578 470 L 560 478" fill="none" stroke="#a88165" stroke-width="2"/>
  <path d="M 950 470 C 980 470, 995 470, 1028 470" class="dash"/>
  <path d="M 1020 462 L 1038 470 L 1020 478" fill="none" stroke="#a88165" stroke-width="2"/>

  <!-- Customer mobile screen -->
  <g transform="translate(110,306)">
    <rect width="338" height="620" rx="38" fill="#342d28"/>
    <rect x="10" y="10" width="318" height="600" rx="30" fill="#fffaf4"/>
    <rect x="10" y="10" width="318" height="168" rx="30" fill="#eee1d0"/>
    <text x="38" y="50" class="tiny">品牌 / 门店可配置</text>
    <circle cx="61" cy="92" r="26" fill="#fffaf4" stroke="#d9c6b3"/>
    <text x="50" y="99" class="ui">M</text>
    <text x="98" y="84" class="serif">商家名称</text>
    <text x="98" y="110" class="uiSmall">门店地址 · 营业信息</text>
    <text x="38" y="148" class="ui">留下你的真实体验</text>
    <rect x="38" y="201" width="262" height="58" rx="14" fill="#fff" stroke="#e4d8ca"/>
    <text x="54" y="227" class="label">本次服务</text>
    <text x="54" y="246" class="small">服务 A　服务 B　服务 C</text>
    <text x="38" y="291" class="label">选择发布平台</text>
    <g transform="translate(38,310)">
      <rect width="126" height="78" rx="14" fill="#f4f8ff" stroke="#c9daf7"/>
      <circle cx="23" cy="25" r="12" fill="#4c83df"/><text x="19" y="29" class="num">G</text>
      <text x="42" y="29" class="ui">Google</text><text x="16" y="58" class="uiSmall">英文评价 →</text>
      <rect x="136" width="126" height="78" rx="14" fill="#fff4f5" stroke="#f2c6cc"/>
      <circle cx="159" cy="25" r="12" fill="#e55a68"/><text x="154" y="29" class="num">红</text>
      <text x="178" y="29" class="ui">小红书</text><text x="152" y="58" class="uiSmall">中文笔记 →</text>
      <rect y="90" width="126" height="78" rx="14" fill="#fff5f2" stroke="#f1cfc7"/>
      <circle cx="23" cy="115" r="12" fill="#c75247"/><text x="19" y="119" class="num">Y</text>
      <text x="42" y="119" class="ui">Yelp</text><text x="16" y="148" class="uiSmall">评价草稿 →</text>
      <rect x="136" y="90" width="126" height="78" rx="14" fill="#faf4ff" stroke="#e2cdee"/>
      <circle cx="159" cy="115" r="12" fill="#9a5ba8"/><text x="151" y="119" class="num">IG</text>
      <text x="178" y="119" class="ui">Instagram</text><text x="152" y="148" class="uiSmall">内容文案 →</text>
    </g>
    <text x="38" y="528" class="tiny">统一布局；Logo、色彩、文案、服务和链接可配置</text>
    <rect x="38" y="549" width="262" height="36" rx="18" fill="#8d6750"/>
    <text x="125" y="572" class="num">选择平台继续</text>
  </g>

  <!-- AI draft mobile -->
  <g transform="translate(578,306)">
    <rect width="338" height="620" rx="38" fill="#342d28"/>
    <rect x="10" y="10" width="318" height="600" rx="30" fill="#fffdfa"/>
    <text x="38" y="52" class="ui">← 返回平台选择</text>
    <text x="38" y="92" class="serif">AI 文案助手</text>
    <text x="38" y="118" class="uiSmall">只根据顾客填写的真实感受生成</text>
    <text x="38" y="154" class="label">① 真实体验</text>
    <rect x="38" y="168" width="262" height="86" rx="14" fill="#fff" stroke="#ddcfbf"/>
    <text x="53" y="195" class="uiSmall">例如：过程不赶，每一步都会</text>
    <text x="53" y="215" class="uiSmall">先说明，我没有觉得被催促。</text>
    <text x="38" y="286" class="label">② 服务与标签（可多选）</text>
    <rect x="38" y="302" width="83" height="30" rx="15" fill="#f3e8db"/><text x="53" y="322" class="uiSmall">服务 A</text>
    <rect x="130" y="302" width="83" height="30" rx="15" fill="#fff" stroke="#e5d8c9"/><text x="145" y="322" class="uiSmall">服务 B</text>
    <rect x="222" y="302" width="78" height="30" rx="15" fill="#fff" stroke="#e5d8c9"/><text x="237" y="322" class="uiSmall">不催促</text>
    <text x="38" y="370" class="label">③ 平台与口吻</text>
    <rect x="38" y="386" width="65" height="30" rx="15" fill="#e8f0fe"/><text x="53" y="406" class="uiSmall">Google</text>
    <rect x="110" y="386" width="66" height="30" rx="15" fill="#fff" stroke="#e5d8c9"/><text x="124" y="406" class="uiSmall">自然</text>
    <rect x="183" y="386" width="60" height="30" rx="15" fill="#fff" stroke="#e5d8c9"/><text x="198" y="406" class="uiSmall">简洁</text>
    <text x="38" y="456" class="label">④ 可编辑草稿</text>
    <rect x="38" y="470" width="262" height="76" rx="14" fill="#fff" stroke="#ddcfbf"/>
    <text x="53" y="495" class="uiSmall">I visited [商家名称] for [服务 A]...</text>
    <text x="53" y="515" class="uiSmall">顾客填写的体验原话会保留在这里。</text>
    <rect x="38" y="561" width="262" height="36" rx="18" fill="#477fd9"/>
    <text x="115" y="584" class="num">复制并前往平台</text>
  </g>

  <!-- Desktop dashboard -->
  <g transform="translate(1038,306)">
    <rect width="430" height="620" rx="20" fill="#fffdfa" stroke="#d9cec2" stroke-width="2"/>
    <rect width="100" height="620" rx="20" fill="#302b27"/>
    <rect x="82" width="18" height="620" fill="#302b27"/>
    <text x="24" y="49" class="num">RF</text>
    <text x="22" y="96" class="tiny" fill="#d9d0c7">经营概览</text>
    <text x="22" y="137" class="tiny" fill="#d9d0c7">品牌门店</text>
    <text x="22" y="178" class="tiny" fill="#d9d0c7">服务商品</text>
    <rect x="13" y="198" width="75" height="32" rx="8" fill="#55483e"/>
    <text x="22" y="219" class="tiny" fill="#fff">平台链接</text>
    <text x="22" y="269" class="tiny" fill="#d9d0c7">内容工作台</text>
    <text x="22" y="310" class="tiny" fill="#d9d0c7">评价回复</text>
    <text x="128" y="44" class="ui">商家 / 门店切换⌄</text>
    <rect x="122" y="60" width="284" height="1" fill="#e7ddd2"/>
    <text x="128" y="97" class="serif">门店经营概览</text>
    <g transform="translate(128,119)">
      <rect width="86" height="74" rx="12" fill="#f7f0e8"/><text x="14" y="27" class="tiny">生成草稿</text><text x="14" y="56" class="serif">128</text>
      <rect x="96" width="86" height="74" rx="12" fill="#f2f6ee"/><text x="110" y="27" class="tiny">已复制</text><text x="110" y="56" class="serif">76</text>
      <rect x="192" width="86" height="74" rx="12" fill="#f3f5fb"/><text x="206" y="27" class="tiny">已打开</text><text x="206" y="56" class="serif">52</text>
    </g>
    <text x="128" y="232" class="label">平台配置</text>
    <g transform="translate(128,248)">
      <rect width="133" height="70" rx="12" fill="#fff" stroke="#e2d8cf"/><text x="14" y="25" class="ui">Google</text><text x="14" y="48" class="uiSmall">✓ 已启用 · 链接已配置</text>
      <rect x="145" width="133" height="70" rx="12" fill="#fff" stroke="#e2d8cf"/><text x="159" y="25" class="ui">小红书</text><text x="159" y="48" class="uiSmall">配置发布 / 主页链接</text>
      <rect y="81" width="133" height="70" rx="12" fill="#fff" stroke="#e2d8cf"/><text x="14" y="106" class="ui">Yelp</text><text x="14" y="129" class="uiSmall">暂未启用</text>
      <rect x="145" y="81" width="133" height="70" rx="12" fill="#fff" stroke="#e2d8cf"/><text x="159" y="106" class="ui">Instagram</text><text x="159" y="129" class="uiSmall">暂未启用</text>
    </g>
    <text x="128" y="432" class="label">内容与回复工作台</text>
    <rect x="128" y="448" width="278" height="66" rx="12" fill="#fff" stroke="#e2d8cf"/>
    <text x="143" y="473" class="uiSmall">输入真实体验 → 生成四平台草稿 → 编辑复制</text>
    <text x="143" y="495" class="uiSmall">评价回复：引用原评价，不编造承诺或细节</text>
    <rect x="128" y="537" width="130" height="36" rx="18" fill="#8d6750"/>
    <text x="160" y="560" class="num">管理配置</text>
    <rect x="270" y="537" width="136" height="36" rx="18" fill="#fff" stroke="#d9c7b6"/>
    <text x="302" y="560" class="uiSmall">查看顾客页</text>
  </g>

  <!-- Footer notes -->
  <line x1="98" y1="956" x2="1502" y2="956" class="line"/>
  <text x="112" y="985" class="label">给设计的明确交付：</text>
  <text x="260" y="985" class="caption">按这三类页面出低保真 / 高保真原型，定义服务卡、平台卡、输入区、草稿卡、数据卡、按钮状态及响应式规则。</text>
</svg>
